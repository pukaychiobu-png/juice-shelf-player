</head><body><main class="shell"><nav class="nav"><a class="back" href="index.html">← Playlist biasa</a><span class="pill">Special collection</span></nav><header class="hero"><div><p class="kicker">Four tracks · four full atmospheres</p><h1>SPECIAL<br><span>ROOM.</span></h1></div><p class="hero-copy">Pilih satu scene. Setiap track punya visual, ambience, editor lirik cloud, dan cinematic room sendiri.</p></header><section class="card-grid" id="cards"><button class="track-card bw" data-id="1fCeXjoRExPP2qwSBh2aST" data-name="Black & White" data-artist="Juice WRLD" data-theme="bw"><span class="track-index">01 · MONOCHROME GALLERY</span><h2>Black<br>& White</h2><p>Juice WRLD</p></button><button class="track-card bandit" data-id="1oWM79mUVdZGCGYjSirHZR" data-name="Bandit" data-artist="Juice WRLD, YoungBoy Never Broke Again" data-theme="bandit"><span class="track-index">02 · SCARLET STORM</span><h2>Bandit</h2><p>Juice WRLD · YoungBoy Never Broke Again</p></button><button class="track-card flaws" data-id="2BSbCCbaSCzkOEZa6N5901" data-name="Flaws And Sins" data-artist="Juice WRLD" data-theme="flaws"><span class="track-index">03 · CRIMSON VOID</span><h2>Flaws<br>And Sins</h2><p>Juice WRLD</p></button><button class="track-card suicidal" data-id="4S2uhQE8L9V6p7rj7SiauJ" data-name="Suicidal (Remix)" data-artist="YNW Melly, Juice WRLD" data-theme="suicidal"><span class="track-index">04 · AMBER AURORA</span><h2>Suicidal</h2><p>YNW Melly · Juice WRLD</p></button></section><section class="panel" id="panel"><div><p class="world" id="world">—</p><h3 id="title">—</h3><p class="artist" id="artist">—</p><iframe id="player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div><div class="editor"><div class="editor-head"><span>Lyrics editor</span><span id="status">select a track</span></div><textarea id="lyrics" placeholder="Satu baris = satu scene cinematic."></textarea><div class="actions"><button class="button" id="auth">Admin sign in</butto <script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js';import{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyDUclkKHZC16QCYb5xeRHg55IZHmJA7_OI',authDomain:'lirik-lagu-8b4e2.firebaseapp.com',projectId:'lirik-lagu-8b4e2',storageBucket:'lirik-lagu-8b4e2.firebasestorage.app',messagingSenderId:'795702258465',appId:'1:795702258465:web:6d704efba58241c73eac60'}),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=s=>document.querySelector(s);let song,user,lines=[],index=0;const cache=JSON.parse(localStorage.getItem('midnight-shelf-lyrics-v1')||'{}');function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}async function choose(card){song=card.dataset;document.documentElement.style.setProperty('--accent',song.theme==='bw'?'#fff':song.theme==='suicidal'?'#ffbd5b':'#ff3d5c');document.documentElement.style.setProperty('--accent2',song.theme==='suicidal'?'#f63555':'#ffbf63');$('#panel').classList.add('open');$('#world').textContent=card.querySelector('.track-index').textContent;$('#title').textContent=song.name;$('#artist').textContent=song.artist;$('#player').src='https://open.spotify.com/embed/track/'+song.id+'?theme=0';$('#status').textContent='loading';try{const snap=await getDoc(doc(db,'lyrics',song.id));const text=snap.exists()&&typeof snap.data().text==='string'?snap.data().text:cache[song.id]||'';$('#lyrics').value=text;cache[song.id]=text;localStorage.setItem('midnight-shelf-lyrics-v1',JSON.stringify(cache));$('#status').textContent=text?'cloud saved':'empty'}catch(e){$('#lyrics').value=cache[song.id]||'';$('#status').textContent='local only'}$('#panel').scrollIntoView({behavior:'smooth',block:'center'})}document.querySelectorAll('.track-card').forEach(c=>c.onclick=()=>choose(c));onAuthStateChanged(auth,u=>{user=u;$('#auth').textContent=u?'Sign out':'Admin sign in'});$('#auth').onclick=async()=>{try{auth.currentUser?await signOut(auth):await signInWithPopup(auth,provider)}catch(e){toast(e.code==='auth/unauthorized-domain'?'Tambahkan domain Vercel ke Firebase':'Login gagal')}};$('#save').onclick=async()=>{if(!song)return;if(!user)return $('#auth').click();const text=$('#lyrics').value.trim();try{await setDoc(doc(db,'lyrics',song.id),{text,updatedAt:serverTimestamp()},{merge:true});cache[song.id]=text;localStorage.setItem('midnight-shelf-lyrics-v1',JSON.stringify(cache));$('#status').textContent='cloud saved';toast('Lirik tersimpan ke cloud')}catch(e){toast('Akun ini tidak punya izin simpan')}};function render(){const line=$('#line');line.textContent=lines[index]||'Lyrics belum tersedia';line.style.animation='none';void line.offsetWidth;line.style.animation=''}$('#open').onclick=()=>{if(!song)return;lines=$('#lyrics').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);index=0;$('#cinema').className='cinema open '+song.theme;$('#meta').textContent=song.name+' · '+song.artist;render()};$('#close').onclick=()=>$('#cinema').className='cinema';$('#cinema').onclick=e=>{if(e.target===$('#cinema')&&lines.length){index=(index+1)%lines.length;render()}};document.addEventListener('keydown',e=>{if(!$('#cinema').classList.contains('open'))return;if(e.key==='Escape')$('#cinema').className='cinema';if((e.key==='ArrowRight'||e.key===' ')&&lines.length){e.preventDefault();index=(index+1)%lines.length;render()}});</script></body></html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08060f">
  <title>Midnight Shelf — Loading</title>
  <style>html,body{margin:0;min-height:100%;background:#08060f;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh}.boot{opacity:.7;font-size:12px;letter-spacing:.14em;text-transform:uppercase}</style>
</head>
<body>
  <div class="boot">loading midnight shelf…</div>
  <script>
    (async()=>{
      try{
        const files=Array.from({length:10},(_,i)=>`index-sync-src/part-${String(i+1).padStart(2,'0')}.txt`);
        const parts=await Promise.all(files.map(async file=>{
          const response=await fetch(file,{cache:'no-store'});
          if(!response.ok)throw new Error(`${file}: ${response.status}`);
          return response.text();
        }));
        const html=parts.join('');
        if(!html.includes('open-tap-sync')||!html.includes('onSpotifyIframeApiReady'))throw new Error('Synced index source incomplete');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        document.body.innerHTML='<div style="padding:24px;text-align:center"><b>Midnight Shelf gagal dimuat.</b><br><small>Coba refresh halaman.</small></div>';
      }
    })();
  </script>
</body>
</html>

<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Room</title><style>@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#080508;color:#fff;font-family:Unbounded,sans-serif}.room{min-height:100vh;padding:32px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#321018,transparent 45%)}a{color:#ffc778;text-decoration:none;font-size:12px}.head{margin:8vh auto 35px;max-width:1100px}.head p{color:#ffb56b;font-size:11px;letter-spacing:.18em}.head h1{font-size:clamp(40px,9vw,110px);letter-spacing:-.1em;margin:0}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{min-height:230px;padding:25px;border:1px solid #ffffff24;border-radius:26px;background:#141016;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-7px)}.card b{display:block;font-size:clamp(25px,4vw,49px);letter-spacing:-.08em;margin-top:55px}.bw{background:repeating-linear-gradient(135deg,#eee 0 2px,#111 2px 14px);color:#111}.bandit{background:radial-gradient(circle,#ff283f,#250208 65%);box-shadow:0 0 55px #ff234555}.flaws{background:radial-gradient(circle at 50%,#020102 0 10%,#130207 12%,#b91528 14%,#080105 26%)}.suicidal{background:linear-gradient(130deg,#7c0b12,#ffbd32,#260306)}.scene{display:none;position:fixed;inset:0;padding:32px;place-items:center;text-align:center;background:#050105;z-index:2}.scene.open{display:grid}.scene h2{font-size:clamp(44px,10vw,130px);letter-spacing:-.12em;margin:0}.scene p{color:#ffc778}.close{position:absolute;top:25px;right:30px}iframe{width:min(640px,100%);height:152px;border:0;border-radius:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.room{padding:20px}}</style><main class="room"><a href="index.html">← PLAYLIST BIASA</a><div class="head"><p>FOUR TRACKS · FOUR ATMOSPHERES</p><h1>SPECIAL<br>ROOM.</h1></div><div class="grid"><button class="card bw" data-id="1fCeXjoRExPP2qwSBh2aST" data-name="BLACK & WHITE">01<b>Black & White</b></button><button class="card bandit" data-id="1oWM79mUVdZGCGYjSirHZR" data-name="BANDIT">02<b>Bandit</b></button><button class="card flaws" data-id="2BSbCCbaSCzkOEZa6N5901" data-name="FLAWS AND SINS">03<b>Flaws And Sins</b></button><button class="card suicidal" data-id="4S2uhQE8L9V6p7rj7SiauJ" data-name="SUICIDAL">04<b>Suicidal</b></button></div></main><section class="scene" id="scene"><a class="close" href="#" id="close">× CLOSE</a><div><p>SPECIAL ROOM EXPERIENCE</p><h2 id="name"></h2><iframe id="player" allow="autoplay;clipboard-write;encrypted-media;fullscreen;picture-in-picture"></iframe></div></section><script>const s=document.querySelector('#scene'),n=document.querySelector('#name'),p=document.querySelector('#player');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{n.textContent=c.dataset.name;p.src='https://open.spotify.com/embed/track/'+c.dataset.id+'?theme=0';s.className='scene open '+c.classList[1]});document.querySelector('#close').onclick=e=>{e.preventDefault();s.className='scene';p.src=''}</script></html>

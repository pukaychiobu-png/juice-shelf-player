r(--a)}iframe{width:100%;height:152px;margin-top:21px;border:0;border-radius:15px}.editor{padding:16px;border:1px solid #ffffff22;border-radius:18px;background:#ffffff08}.editor-head{display:flex;justify-content:space-between;font:10px DM Mono;letter-spacing:.1em}.status{color:#ffcb77;text-shadow:0 0 10px #ff9d4d}textarea{width:100%;height:145px;margin-top:12px;padding:13px;border:1px solid #ffffff30;border-radius:12px;background:#030103;color:#fff;resize:vertical;font:13px/1.5 Space Grotesk}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:11px}.btn{border:1px solid #ffffff42;border-radius:999px;padding:11px 13px;color:#fff;background:#ffffff10;font:600 10px DM Mono;letter-spacing:.06em;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 20px var(--a)}.primary{background:linear-gradient(90deg,var(--a),var(--b));color:#180306}.cinema{position:fixed;inset:0;z-index:8;display:none;place-items:center;overflow:hidden;background:var(--bg);text-align:center}.cinema.open{display:grid}.cinema:before,.cinema:after{content:"";position:absolute}.close{position:absolute;z-index:4;right:24px;top:22px}.meta{position:absolute;z-index:4;left:29px;top:28px;color:#fff;font:10px DM Mono;letter-spacing:.13em;text-shadow:0 0 12px currentColor}.line{position:relative;z-index:3;max-width:min(1120px,86vw);margin:0;color:#fff;font:600 clamp(35px,7.2vw,108px)/.98 Unbounded;letter-spacing:-.11em;text-shadow:0 0 9px #fff,0 0 27px var(--a),0 0 88px var(--a),0 0 150px var(--a);animation:linein .68s both}.hint{position:absolute;z-index:4;bottom:25px;color:#fff;font:11px DM Mono;text-shadow:0 0 12px var(--a)}.reaction{position:absolute;z-index:6;top:calc(50% - min(18vw,150px));left:calc(50% + min(34vw,440px));display:grid;width:clamp(38px,6vw,76px);aspect-ratio:1;border:1px solid #fff8;border-radius:50%;color:#fff;background:#ffffff18;place-items:center;font:clamp(19px,3vw,36px)/1 Space Grotesk;opacity:0;transform:scale(.3) rotate(-20deg);filter:drop-shadow(0 0 80%);filter:blur(32px) saturate(1.5);animation:aurora 12s ease-in-out infinite alternate}.cinema.suicidal:after{inset:0;opacity:.44;background:repeating-linear-gradient(109deg,transparent 0 72px,#fff2 73px 74px);mix-blend-mode:screen;animation:aurora 15s ease-in-out infinite alternate-reverse}.toast{position:fixed;z-index:12;bottom:24px;left:50%;padding:10px 15px;border-radius:999px;color:#210309;background:#fff7ee;transform:translate(-50%,90px);transition:.25s}.toast.show{transform:translate(-50%,0)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes floor{to{transform:perspective(520px) rotateX(62deg) translateY(53px)}}@keyframes float{50%{transform:translate(-7px,12px);opacity:.75}}@keyframes aurora{to{transform:translate3d(11%,-9%,0) rotate(-8deg) scale(1.15)}}@keyframes ribbon{to{transform:translateY(22vh) skewX(-15deg) scaleX(1.15)}}@keyframes slide{to{transform:translateX(25vw) rotate(9deg)}}@keyframes breathe{50%{transform:scale(.74);opacity:.58}}@keyframes light{0%,71%,100%{opacity:0}73%,76%{opacity:1}79%{opacity:.12}82%{opacity:.8}}@keyframes linein{from{opacity:0;filter:blur(17px);transform:translateY(34px) scale(.92)}to{opacity:1;filter:none;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.25) rotate(-24deg);filter:blur(8px)}55%{opacity:1;transform:scale(1.18) rotate(7deg)}100%{opacity:.9;transform:scale(1) rotate(0);filter:blur(0)}}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@media(max-width:730px){.room{padding:20px}.hero{display:block;margin-top:70px}.intro{margin-top:25px}.grid,.panel{grid-template-columns:1fr}.card{min-height:220px}.actions{flex-wrap:wrap}.reaction{top:17%;left:auto;right:12%}.meta{left:20px;top:20px}}</style></head><body><main class="room"><a class="back" href="index.html">← PLAYLIST BIASA</a><header class="hero"><div><p>FOUR TRACKS · FOUR WORLDS</p><h1>SPECIAL<br><span>ROOM.</span></h1></div><p class="intro">Empat visual berbeda, lirik cloud sendiri, dan satu tap untuk melanjutkan cinematic.</p></header><section class="grid"><button class="card bw" data-id="1fCeXjoRExPP2qwSBh2aST" data-name="Black & White" data-artist="Juice WRLD" data-theme="bw"><span class="tag">01 · MONOCHROME GALLERY</span><h2>Black<br>& White</h2><p>Juice WRLD</p></button><button class="card bandit" data-id="1oWM79mUVdZGCGYjSirHZR" data-name="Bandit" data-artist="Juice WRLD, YoungBoy Never Broke Again" data-theme="bandit"><span class="tag">02 · SCARLET STORM</span><h2>Bandit</h2><p>Juice WRLD · YoungBoy</p></button><button class="card flaws" data-id="2BSbCCbaSCzkOEZa6N5901" data-name="Flaws And Sins" data-artist="Juice WRLD" data-theme="flaws"><span class="tag">03 · CRIMSON VOID</span><h2>Flaws<br>And Sins</h2><p>Juice WRLD</p></button><button class="card suicidal" data-id="4S2uhQE8L9V6p7rj7SiauJ" data-name="Suicidal (Remix)" data-artist="YNW Melly, Juice WRLD" data-theme="suicidal"><span class="tag">04 · AMBER AURORA</span><h2>Suicidal</h2><p>YNW Melly · Juice WRLD</p></button></section><section class="panel" id="panel"><div><p class="world" id="world">—</p><h3 id="title">—</h3><p class="artist" id="artist">—</p><iframe id="player" allow="autoplay;clipboard-write;encrypted-media;fullscreen;picture-in-picture"></iframe></div><div class="editor"><div class="editor-head"><span>Lyrics editor</span><span class="status" id="status">select track</span></div><textarea id="lyrics" placeholder="Satu baris = satu scene cinematic."></textarea><div class="actions"><button class="btn" id="auth">ADMIN SIGN IN</button><span><button class="btn" id="open">CINEMATIC</button><button class="btn primary" id="save">SAVE CLOUD</button></span></div></div></section></main><section class="cinema" id="cinema"><button class="btn close" id="close">× CLOSE</button><p class="meta" id="meta"></p><p class="line" id="line">Lyrics belum tersedia</p><span class="reaction" id="reaction" aria-hidden="true"></span><p class="hint">tap layar / → untuk lanjut</p></section><div class="toast" id="toast"></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js';import{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyDUclkKHZC16QCYb5xeRHg55IZHmJA7_OI',authDomain:'lirik-lagu-8b4e2.firebaseapp.com',projectId:'lirik-lagu-8b4e2',storageBucket:'lirik-lagu-8b4e2.firebasestorage.app',messagingSenderId:'795702258465',appId:'1:795702258465:web:6d704efba58241c73eac60'}),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=s=>document.querySelector(s);let song,user,lines=[],pos=0;const cache=JSON.parse(localStorage.getItem('midnight-shelf-lyrics-v1')||'{}');function toast(x){$('#toast').textContent=x;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1700)}async function choose(card){song=card.dataset;$('#panel').classList.add('open');$('#world').textContent=card.querySelector('.tag').textContent;$('#title').textContent=song.name;$('#artist').textContent=song.artist;$('#player').src='https://open.spotify.com/embed/track/'+song.id+'?theme=0';$('#status').textContent='loading';try{let s=await getDoc(doc(db,'lyrics',song.id)),x=s.exists()&&typeof s.data().text==='string'?s.data().text:cache[song.id]||'';$('#lyrics').value=x;cache[song.id]=x;localStorage.setItem('midnight-shelf-lyrics-v1',JSON.stringify(cache));$('#status').textContent=x?'cloud saved':'empty'}catch(e){$('#lyrics').value=cache[song.id]||'';$('#status').textContent='local only'}$('#panel').scrollIntoView({behavior:'smooth',block:'center'})}document.querySelectorAll('.card').forEach(c=>c.onclick=()=>choose(c));onAuthStateChanged(auth,u=>{user=u;$('#auth').textContent=u?'SIGN OUT':'ADMIN SIGN IN'});$('#auth').onclick=async()=>{try{auth.currentUser?await signOut(auth):await signInWithPopup(auth,provider)}catch(e){toast(e.code==='auth/unauthorized-domain'?'Tambahkan domain Vercel ke Firebase':'Login gagal')}};$('#save').onclick=async()=>{if(!song)return;if(!user)return $('#auth').click();const x=$('#lyrics').value.trim();try{await setDoc(doc(db,'lyrics',song.id),{text:x,updatedAt:serverTimestamp()},{merge:true});cache[song.id]=x;localStorage.setItem('midnight-shelf-lyrics-v1',JSON.stringify(cache));$('#status').textContent='cloud saved';toast('Lirik tersimpan')}catch(e){toast('Akun ini tidak punya izin simpan')}};function render(){const text=lines[pos]||'',line=$('#line'),reaction=$('#reaction'),words=text?text.split(/\s+/).length:0;line.textContent=text||'Lyrics belum tersedia';let icon='✹',kind='';if(text.includes('!')){icon='⚡';kind='hot'}else if(/\.{3,}/.test(text)){icon='···';kind='pause'}else if(words>0&&words<=4){icon='✦';kind='short'}reaction.textContent=icon;reaction.className='reaction '+kind;void line.offsetWidth;line.style.animation='none';reaction.classList.add('show');void line.offsetWidth;line.style.animation=''}$('#open').onclick=()=>{if(!song)return;lines=$('#lyrics').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);pos=0;$('#cinema').className='cinema open '+song.theme;$('#meta').textContent=song.name+' · '+song.artist;render()};$('#close').onclick=()=>$('#cinema').className='cinema';$('#cinema').onclick=e=>{if(e.target===$('#cinema')&&lines.length){pos=(pos+1)%lines.length;render()}};document.addEventListener('keydown',e=>{if(!$('#cinema').classList.contains('open'))return;if(e.key==='Escape')$('#cinema').className='cinema';if((e.key==='ArrowRight'||e.key===' ')&&lines.length){e.preventDefault();pos=(pos+1)%lines.length;render()}});</script></body></html>

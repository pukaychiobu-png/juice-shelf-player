<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Bandit — Special Room</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Unbounded:wght@500;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff6ee;background:#090104;font-family:DM Mono,monospace;overflow:hidden}body:before{content:"";position:fixed;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,30,60,.18),transparent,rgba(255,177,73,.12),transparent);animation:r 17s linear infinite}.bolt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 15%,rgba(255,236,193,.75),rgba(255,36,70,.2) 25%,transparent 56%);opacity:0;mix-blend-mode:screen}.bolt.go{animation:b .7s ease-out}.embers i{position:fixed;bottom:-20px;left:var(--x);width:var(--s);height:var(--s);background:#ffb44f;border-radius:50%;box-shadow:0 0 14px #ff284d;animation:e var(--d) linear var(--delay) infinite}.room{position:relative;min-height:100vh;padding:28px;display:grid;grid-template-rows:auto 1fr auto}.back{color:#ffcc7b;text-decoration:none;font-size:12px;letter-spacing:.12em}.hero{display:grid;place-items:center;text-align:center}.k{color:#ffb14d;letter-spacing:.22em;font-size:11px}.hero h1{margin:14px 0 4px;font-family:Unbounded,sans-serif;font-size:clamp(56px,14vw,190px);letter-spacing:-.12em;text-shadow:0 0 24px #ff294f,0 0 100px rgba(255,31,62,.45)}.hero p{color:#ffb2a1}.ring{position:absolute;width:min(72vw,760px);aspect-ratio:1;border:1px solid rgba(255,95,99,.45);border-radius:50%;box-shadow:0 0 0 48px rgba(255,45,71,.04),0 0 120px rgba(255,31,64,.38);animation:r 25s linear infinite;z-index:-1}.panel{width:min(720px,100%);margin:auto;padding:20px;border:1px solid rgba(255,91,95,.35);border-radius:24px;background:rgba(24,3,8,.65);backdrop-filter:blur(18px)}iframe{width:100%;height:152px;border:0;border-radius:12px}.actions{display:flex;gap:10px;margin-top:14px}.actions button{border:1px solid #ff7b5a;border-radius:999px;padding:11px 15px;color:#fff;background:linear-gradient(90deg,#d8163b,#ff7d45);font:inherit}.lyric{display:none;position:fixed;inset:0;padding:32px;place-items:center;text-align:center;background:radial-gradient(circle,rgba(255,35,66,.25),#080103 65%);z-index:3}.lyric.open{display:grid}.line{font-family:Unbounded,sans-serif;font-size:clamp(30px,7vw,100px);line-height:1;max-width:1100px;text-shadow:0 0 26px #ff334f;animation:in .65s both}.close{position:absolute;top:25px;right:25px;background:none!important}.hint{font-size:11px;color:#ffb88b}.editor{display:none}@keyframes r{to{transform:rotate(360deg)}}@keyframes b{10%{opacity:1}24%{opacity:.1}37%{opacity:.7}100%{opacity:0}}@keyframes e{to{transform:translate(var(--dx),-110vh);opacity:0}}@keyframes in{from{opacity:0;filter:blur(17px);transform:translateY(32px)}to{opacity:1;filter:blur(0);transform:none}}</style></head><body><div class="bolt" id="bolt"></div><div class="embers" id="embers"></div><main class="room"><a class="back" href="index.html">← KEMBALI KE PLAYLIST</a><section class="hero"><div class="ring"></div><div><p class="k">SPECIAL ROOM · SCARLET STORM</p><h1>BANDIT</h1><p>JUICE WRLD · YOUNGBOY NEVER BROKE AGAIN</p></div><div class="panel"><iframe src="https://open.spotify.com/embed/track/1oWM79mUVdZGCGYjSirHZR?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe><div class="actions"><button id="open">OPEN CINEMATIC</button></div></div></section><p class="hint">scarlet lightning · amber embers · tap to advance</p></main><section class="lyric" id="lyric"><button class="close" id="close">×</button><p class="line" id="line">Lyrics belum tersedia</p><p class="hint">Tambahkan lirik lewat editor Bandit di playlist dahulu.</p></section><script>const b=document.getElementById('bolt'),e=document.getElementById('embers');for(let i=0;i<55;i++){let x=document.createElement('i');x.style.cssText=`--x:${Math.random()*100}%;--s:${2+Math.random()*5}px;--d:${4+Math.random()*7}s;--delay:${-Math.random()*9}s;--dx:${-120+Math.random()*240}px`;e.append(x)}function f(){b.classList.remove('go');void b.offsetWidth;b.classList.add('go');setTimeout(f,2800+Math.random()*5000)}f();document.getElementById('open').onclick=()=>document.getElementById('lyric').classList.add('open');document.getElementById('close').onclick=()=>document.getElementById('lyric').classList.remove('open')</script></body></html>
